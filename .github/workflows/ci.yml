name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege for the automatic token. CI only ever needs to read the
# repository; without this it inherits whatever the repository default happens
# to be, which is a setting somebody can change later without thinking about
# this file.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The Windows backend targets a neutral TFM on purpose, so the whole
        # solution must keep compiling on Linux and macOS well before their
        # backends exist. This matrix is what enforces that.
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        # Warnings are errors (see Directory.Build.props); this step is the gate.
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      # Runs the platform backend on each OS and prints what it found. This is
      # the only place the macOS backend is executed at all -- it was written
      # without a Mac to try it on, so the runner is what turns "compiles" into
      # "does something". The tool always exits 0: an unsupported platform is a
      # result to read, not a build failure.
      - name: Platform diagnostics
        run: dotnet run --project tools/Redture.Diagnostics --configuration Release --no-build

      # X11 is only reachable on the Linux runner with a virtual server, and
      # this is what proves the gamma write path end to end there.
      - name: Platform diagnostics under X11
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-6 libxrandr2 xvfb
          Xvfb :99 -screen 0 1920x1080x24 +extension RANDR &
          sleep 3
          DISPLAY=:99 dotnet run --project tools/Redture.Diagnostics --configuration Release --no-build -- --test-gamma
